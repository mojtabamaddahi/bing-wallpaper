name: Bing Wallpaper Bot

on:
  schedule:
    - cron: "0 */5 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bing Bot
      env:
        BINGWALLS_BOT_API: ${{ secrets.BINGWALLS_BOT_API }}
        BING_WALLPAPERS_CHANNEL_USERNAME: ${{ secrets.BING_WALLPAPERS_CHANNEL_USERNAME }}
        LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
      run: |
        python bing.py
