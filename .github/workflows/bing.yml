name: Bing Wallpaper Bot

on:
  schedule:
    - cron: "30 20 * * *"  # هر روز ساعت ۱۲ شب ایران
  workflow_dispatch:       # برای تست دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Requirements
        run: pip install requests

      - name: Run bing.py
        run: python bing.py
        env:
          BINGWALLS_BOT_API: ${{ secrets.BINGWALLS_BOT_API }}
          BING_WALLPAPERS_CHANNEL_USERNAME: ${{ secrets.BING_WALLPAPERS_CHANNEL_USERNAME }}
          LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
